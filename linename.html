<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KP台灣民眾黨 黨員查詢系統</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      background: #70cce1;
    }

    h1 {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 16px;
      text-align: center;
    }

    h2 {
      font-size: 17px;
      font-weight: bold;
      margin: 0;
      padding: 0;
    }

    .section {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 0 4px rgba(0,0,0,0.05);
    }

    label {
      display: block;
      margin-top: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      margin-right: 6px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      border: 3px solid #2091c6;
      background: #70cce1;
      color: black;
    }

    button:active {
      background: #2276bd;
      transform: scale(0.97);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 折疊區塊動畫（新增/查詢） */
    .collapse-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
      margin-top: 10px;
    }
    .collapse-content.open {
      max-height: 600px;
    }

    /* 更改資料折疊 */
    #editPanel {
      max-height: 0;
      overflow: hidden;
      margin-top: 10px;
      transition: max-height 0.5s ease;
    }
    #editPanel.open {
      max-height: 700px;
    }

    #toggleEdit, #toggleAdd {
      margin-left: 10px;
    }

    .item {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }

    .item-main {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 2px;
      word-break: break-all;
    }

    .item-sub {
      font-size: 14px;
      margin-bottom: 2px;
      word-break: break-all;
    }

    .item-time {
      font-size: 12px;
      color: #666;
    }

    .empty-text {
      font-size: 14px;
      color: #888;
      padding: 6px 0;
    }
/* ===== 技巧教學：收合內容區 ===== */
#trainingPanel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
  margin-top: 10px;
}
#trainingPanel.open {
  max-height: 2000px; /* 影片多就拉大一點 */
}

/* 技巧教學內部排版（白底區塊內） */
.training-wrap {
  padding-top: 8px;
}
.training-wrap h3 {
  font-size: 16px;
  font-weight: bold;
  margin: 14px 0 8px;
}
.training-video {
  width: 100%;
  max-width: 480px;
  border-radius: 12px;
  margin-top: 8px;
  display: block;
}
.training-text {
  font-size: 14px;
  color: #555;
  margin-top: 6px;
  line-height: 1.5;
}
  </style>
</head>

<body>

  <h1>KP台灣民眾黨 黨員查詢系統</h1>

  <!-- 新增 / 查詢（可折疊） -->
  <div class="section">
    <div class="top-bar">
      <h2 style="margin-right:10px;">新增 / 查詢</h2>

      <button id="toggleAdd">▼ 展開</button>
      <button onclick="loadAll()">顯示全部</button>
    </div>

    <small>● 顯示全部：直接顯示所有名單</small>

    <div id="addPanel" class="collapse-content">
      <label>
        LINE ID：
        <input id="lineInput" type="text" placeholder="例：jason😈🐺🛠😺" />
      </label>

      <label>
        遊戲名字：
        <input id="gameInput" type="text" placeholder="例：ᴷᴾღ帥帥哥" />
      </label>

      <button onclick="saveRecord()">儲存</button>
      <button onclick="searchRecords()">查詢</button>
      <button onclick="clearInputs()">清除</button>

      <small><br>
        ● 儲存：新增一筆新資料<br>
        ● 查詢：可輸入部分文字做模糊搜尋<br>
        ● 清除：將輸入框內的文字刪除
      </small>
    </div>
  </div>

  <!-- 更改資料（可折疊） -->
  <div class="section">
    <h2 style="display:flex; align-items:center; gap:10px;">
      <span style="margin-top:7px;">更改資料</span>
      <button id="toggleEdit">▼ 展開</button>
    </h2>

    <div id="editPanel">
      <!-- 更改 LINE ID -->
      <label>舊 LINE ID：
        <input id="oldLineInput" type="text" placeholder="舊 LINE ID">
      </label>

      <label>新 LINE ID：
        <input id="newLineInput" type="text" placeholder="新 LINE ID">
      </label>

      <button onclick="updateLineId()">更改 LINE ID</button>

      <hr>

      <!-- 更改 遊戲名字 -->
      <label>舊遊戲名字：
        <input id="oldGameInput" type="text" placeholder="舊遊戲名字">
      </label>

      <label>新遊戲名字：
        <input id="newGameInput" type="text" placeholder="新遊戲名字">
      </label>

      <button onclick="updateGameName()">更改遊戲名字</button>

      <small><br>
        ● 若有多筆相同舊名稱，會全部一起修改
      </small>
    </div>
  </div>

  <!-- 顯示結果 -->
  <div class="section">
    <h2 id="listTitle">目前資料（尚未載入）</h2>
    <div id="resultCount" style="font-size:13px; color:#555; margin-top:4px;"></div>
    <div id="listContainer"></div>
  </div>
  <!-- ===== 技巧訓練 ===== -->
<div class="training-section">
<!-- ===== 技巧教學（白底可收合） ===== -->
<div class="section">
  <div class="top-bar" style="display:flex; align-items:center; justify-content:flex-start; gap:10px;">
    <h2 style="margin-right:10px;">技巧教學</h2>
    <button id="toggleTraining">▼ 展開</button>
  </div>
  <small>● 展開後才載入影片（加快首次開啟速度）</small>

  <!-- 可折疊內容 -->
  <div id="trainingPanel">
    <div class="training-wrap">

      <!-- 簡單 -->
      <h3>簡單</h3>
      <div class="training-text">
        順勢：起飄前方向鍵先按
        入彎角度、速度、集氣量會比同時按更好
      </div>
      <video class="training-video lazy-video"
             data-src="shunshi.mp4"
             autoplay muted loop playsinline
             preload="none"></video>
      

      <video class="training-video lazy-video"
             data-src="hs.mp4"
             autoplay muted loop playsinline
             preload="none"></video>
      <div class="training-text">第二個範例，示範常見錯誤與修正方式。</div>

      <!-- 中等 -->
      <h3>中等</h3>

      <video class="training-video lazy-video"
             data-src="lws.mp4"
             autoplay muted loop playsinline
             preload="none"></video>
      <div class="training-text">需要反應速度與時機判斷。</div>

      <!-- 困難 -->
      <h3>困難</h3>

      <video class="training-video lazy-video"
             data-src="wfbc.mp4"
             autoplay muted loop playsinline
             preload="none"></video>
      <div class="training-text">高階技巧，建議熟練後再嘗試。</div>

    </div>
  </div>
</div>

  <!-- 今日瀏覽人次（頁面最底下小字） -->
  <div style="text-align:center; font-size:12px; color:#555; margin-top:12px;">
    今日瀏覽人次：<span id="todayCount">載入中...</span>
  </div>

  <!-- Firebase + Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc,
      getDocs, query, where, updateDoc,
      doc, getDoc, setDoc, increment
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAtaboHWv60PRfwY5qwhOeECq-U_2mDi5M",
      authDomain: "linename-76527.firebaseapp.com",
      projectId: "linename-76527",
      storageBucket: "linename-76527.firebasestorage.app",
      messagingSenderId: "403725086740",
      appId: "1:403725086740:web:6b8b09e8b2e64008fab701"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 你的名單資料表
    const colRef = collection(db, "line_game_records");

    /* -------------------- 工具 -------------------- */
    function cleanInput(str, fieldName, maxLen = 14) {
      const s = (str || "").trim();
      if (!s) throw new Error(fieldName + " 不能空白");
      if (s.length > maxLen) throw new Error(fieldName + " 最多 " + maxLen + " 個字");
      if (/[<>]/.test(s)) throw new Error(fieldName + " 不能包含 < >");
      return s;
    }

    function formatTime(ts) {
      if (!ts) return "未紀錄";
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${day} ${hh}:${mm}`;
    }

    // 安全顯示：用 textContent 避免 XSS
    function renderList(list, titleText) {
      const box = document.getElementById("listContainer");
      const title = document.getElementById("listTitle");
      const countBox = document.getElementById("resultCount");

      title.textContent = titleText || "目前資料";
      box.innerHTML = "";

      // 顯示筆數
      countBox.textContent = `共 ${list.length} 筆資料`;

      if (!list.length) {
        box.innerHTML = `<div class="empty-text">沒有資料。</div>`;
        return;
      }

      list.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";

        const main = document.createElement("div");
        main.className = "item-main";
        main.textContent = `遊戲名字：${item.gameName}`;

        const sub = document.createElement("div");
        sub.className = "item-sub";
        sub.textContent = `LINE ID：${item.lineId}`;

        const time = document.createElement("div");
        time.className = "item-time";
        time.textContent = `修改時間：${formatTime(item.updatedAt)}`;

        div.appendChild(main);
        div.appendChild(sub);
        div.appendChild(time);
        box.appendChild(div);
      });
    }

    /* -------------------- 折疊控制 -------------------- */
    window.addEventListener("load", () => {
      const addBtn = document.getElementById("toggleAdd");
      const addPanel = document.getElementById("addPanel");

      addBtn.addEventListener("click", () => {
        const open = addPanel.classList.toggle("open");
        addBtn.textContent = open ? "▲ 收合" : "▼ 展開";
      });

      const editBtn = document.getElementById("toggleEdit");
      const editPanel = document.getElementById("editPanel");

      editBtn.addEventListener("click", () => {
        const open = editPanel.classList.toggle("open");
        editBtn.textContent = open ? "▲ 收合" : "▼ 展開";
      });
    });

    /* -------------------- Firestore 功能 -------------------- */
    async function loadAll() {
      try {
        const snap = await getDocs(colRef);
        const list = [];

        snap.forEach(docSnap => {
          const d = docSnap.data();
          list.push({
            id: docSnap.id,
            lineId: d.lineId || "",
            gameName: d.gameName || "",
            updatedAt: d.updatedAt || d.createdAt || 0
          });
        });

        list.sort((a, b) => b.updatedAt - a.updatedAt);
        renderList(list, "全部資料（依修改時間）");
      } catch (e) {
        console.error(e);
        document.getElementById("listTitle").textContent = "讀取失敗";
        document.getElementById("resultCount").textContent = "";
        document.getElementById("listContainer").innerHTML =
          `<div class="empty-text">讀取資料失敗，請稍後再試。</div>`;
      }
    }

    async function saveRecord() {
      try {
        const line = cleanInput(document.getElementById("lineInput").value, "LINE ID");
        const game = cleanInput(document.getElementById("gameInput").value, "遊戲名字");
        const now = Date.now();

        await addDoc(colRef, {
          lineId: line,
          gameName: game,
          createdAt: now,
          updatedAt: now
        });

        // 儲存完清空輸入
        document.getElementById("lineInput").value = "";
        document.getElementById("gameInput").value = "";

        // 儲存完直接顯示全部（你想要也可以改成顯示「新增成功」但不刷新）
        await loadAll();
      } catch (e) {
        alert(e.message || "儲存失敗");
      }
    }

    async function searchRecords() {
      const line = document.getElementById("lineInput").value.trim().toLowerCase();
      const game = document.getElementById("gameInput").value.trim().toLowerCase();

      if (!line && !game) return alert("請至少輸入一項查詢");

      try {
        const snap = await getDocs(colRef);
        const list = [];

        snap.forEach(docSnap => {
          const d = docSnap.data();
          const lineId = (d.lineId || "").toLowerCase();
          const gameName = (d.gameName || "").toLowerCase();
          const time = d.updatedAt || d.createdAt || 0;

          if (line && !lineId.includes(line)) return;
          if (game && !gameName.includes(game)) return;

          list.push({
            id: docSnap.id,
            lineId: d.lineId || "",
            gameName: d.gameName || "",
            updatedAt: time
          });
        });

        list.sort((a, b) => b.updatedAt - a.updatedAt);
        renderList(list, "搜尋結果");
      } catch (e) {
        console.error(e);
        alert("查詢失敗，請稍後再試。");
      }
    }

    async function updateLineId() {
      try {
        const oldLine = cleanInput(document.getElementById("oldLineInput").value, "舊 LINE ID", 30);
        const newLine = cleanInput(document.getElementById("newLineInput").value, "新 LINE ID", 30);

        const q = query(colRef, where("lineId", "==", oldLine));
        const snap = await getDocs(q);
        if (snap.empty) return alert("找不到該 LINE ID");

        const now = Date.now();
        const jobs = [];
        snap.forEach(docSnap => {
          jobs.push(updateDoc(docSnap.ref, { lineId: newLine, updatedAt: now }));
        });
        await Promise.all(jobs);

        // 更改完清空輸入框
        document.getElementById("oldLineInput").value = "";
        document.getElementById("newLineInput").value = "";

        alert("修改成功！");
        await loadAll();
      } catch (e) {
        alert(e.message || "修改失敗");
      }
    }

    async function updateGameName() {
      try {
        const oldGame = cleanInput(document.getElementById("oldGameInput").value, "舊遊戲名字", 30);
        const newGame = cleanInput(document.getElementById("newGameInput").value, "新遊戲名字", 30);

        const q = query(colRef, where("gameName", "==", oldGame));
        const snap = await getDocs(q);
        if (snap.empty) return alert("找不到該遊戲名字");

        const now = Date.now();
        const jobs = [];
        snap.forEach(docSnap => {
          jobs.push(updateDoc(docSnap.ref, { gameName: newGame, updatedAt: now }));
        });
        await Promise.all(jobs);

        // 更改完清空輸入框
        document.getElementById("oldGameInput").value = "";
        document.getElementById("newGameInput").value = "";

        alert("修改完成！");
        await loadAll();
      } catch (e) {
        alert(e.message || "修改失敗");
      }
    }

    // 清除（只清新增/查詢的兩格）
    function clearInputs() {
      document.getElementById("lineInput").value = "";
      document.getElementById("gameInput").value = "";
    }

    /* -------------------- 今日瀏覽人次（每日刷新） -------------------- */
    async function updateTodayViewCount() {
      try {
        const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
        const storageKey = "viewed_" + today;

        const countSpan = document.getElementById("todayCount");
        const docRef = doc(db, "daily_views", today);

        const snap = await getDoc(docRef);

        // 今天此裝置第一次開啟才 +1
        if (!localStorage.getItem(storageKey)) {
          if (snap.exists()) {
            await updateDoc(docRef, { count: increment(1) });
          } else {
            await setDoc(docRef, { count: 1 });
          }
          localStorage.setItem(storageKey, "1");
        }

        // 顯示用：再讀一次
        const newSnap = await getDoc(docRef);
        countSpan.textContent = newSnap.exists() ? newSnap.data().count : "0";
      } catch (e) {
        console.error(e);
        const countSpan = document.getElementById("todayCount");
        if (countSpan) countSpan.textContent = "讀取失敗";
      }
    }

    // 掛到 window 讓 HTML onclick 找得到
    window.saveRecord = saveRecord;
    window.searchRecords = searchRecords;
    window.updateLineId = updateLineId;
    window.updateGameName = updateGameName;
    window.loadAll = loadAll;
    window.clearInputs = clearInputs;

    // ✅ 只做今日瀏覽人次；不要自動 loadAll
    updateTodayViewCount();
  </script>

</body>
</html>
